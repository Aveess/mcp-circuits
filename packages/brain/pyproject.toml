[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkercad-brain"
version = "0.1.0"
description = "Cerebro local para construir y verificar circuitos en Tinkercad (destino unico: diseno guardado en Tinkercad)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
