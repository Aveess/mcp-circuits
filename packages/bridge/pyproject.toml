[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkercad-mcp-server"
version = "1.1.0"
description = "Model Context Protocol (MCP) server for Autodesk Tinkercad Circuits automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.49.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
]

[project.scripts]
tinkercad-mcp = "src.main:main"
tinkercad-login = "src.cli.login_cli:main"

# El paquete se llama `src` (asi nacio) y vive en `src/`. Sin esta lista,
# setuptools lo confunde con el layout `src/<paquete>/` e instala `browser`,
# `catalog`... como paquetes de primer nivel, dejando `python -m src.main`
# roto. Declararlo explicito es lo que hace que `pip install -e` funcione.
[tool.setuptools]
packages = ["src", "src.browser", "src.catalog", "src.cli", "src.services"]

